# Verifies the build: the tool itself on every platform it ships for, and the
# projects it generates.
#
# The second half is the point. Nothing else in this repository proves that the
# templates produce a project that compiles — the tests render them and check
# their shape, but rendering well-formed XML is not the same as Maven accepting
# it, and a wrong class name in a Java template is invisible until javac sees it.
#
# Every action is pinned to a commit SHA. A tag is a mutable pointer the action's
# owner can move, so `@v4` is a standing agreement to run whatever code is there
# on the day the job starts — including code added after a maintainer account is
# taken over. The trailing comment names the release the SHA belongs to, since a
# hex string on its own says nothing about how far behind it is.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes an in-flight run of the same branch. The generated
# project jobs are the slow half, and there is nothing to learn from finishing a
# run against code that has already been replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tool:
    name: tool (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          # From go.mod, so the version the build declares is the version CI uses
          # and there is no second place to bump.
          go-version-file: go.mod

      # Not `make check`: make is not reliably present on the Windows runner, and
      # the point of running there is that this tool ships a Windows binary.
      # bash is on all three.
      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      # The tool is distributed as a binary, so the binary being runnable on the
      # platform is part of the build being verified — not just compiling there.
      - name: smoke test the binary
        shell: bash
        run: |
          # The extension matters on Windows: `go build -o vaadin-init` there
          # writes a PE file under a name Windows does not consider executable.
          binary=vaadin-init
          if [ "$RUNNER_OS" = "Windows" ]; then binary=vaadin-init.exe; fi
          go build -o "$binary" .
          "./$binary" --version
          "./$binary" --dry-run --yes --group-id com.example --artifact-id smoke-app

  cross-compile:
    name: cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - name: build every platform
        run: make dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: vaadin-init-binaries
          path: dist/
          if-no-files-found: error

  generated-project:
    name: generated project (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The lean end: no container runtime needed, and nothing optional to
          # hide a fault in the core templates.
          - name: core
            flags: --database=false --auth=false --e2e=false --coverage=false --traceable=false
          # Everything on, which is the combination with the most templates in it
          # and the only one that exercises Flyway, JPA, Testcontainers, the OIDC
          # configuration and the coverage gate together. On Lumo, so that both
          # themes are compiled by a real JDK without a third job; the core leg
          # is left on the Aura default.
          - name: full
            flags: --database --auth --e2e --coverage --traceable --theme lumo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      - name: build vaadin-init
        run: go build -o vaadin-init .

      # vaadin-init makes the generated project's first commit, and git will not
      # commit without an identity. A runner has none by default, which is also
      # the case that has to degrade gracefully rather than fail — so it is set
      # here deliberately rather than assumed.
      - name: give git an identity
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"

      - name: generate a project
        run: ./vaadin-init --yes --group-id io.binarycodes --artifact-id ci-app --dir generated ${{ matrix.flags }}

      # The commit is what makes the next step possible at all when traceable
      # builds are on: the build refuses to run without a SHA to stamp. Asserted
      # rather than assumed, since a silent failure here would show up as a
      # confusing build error below.
      - name: check it committed itself
        working-directory: generated
        run: |
          git log --oneline
          test -z "$(git status --porcelain)" || {
            echo "the generated project should have a clean working tree"; exit 1;
          }

      # After the project exists, not before: the Maven cache is keyed by hashing
      # a pom, and until vaadin-init has run there is no pom in this checkout to
      # hash — setup-java fails outright rather than skipping the cache. The
      # generated pom is named explicitly for the same reason, and it also keys
      # the two matrix legs apart, which is right: they resolve different
      # dependencies.
      #
      # Matches the JDK the generated pom pins. run.sh looks for the configured
      # JDK under ~/.sdkman and falls back to JAVA_HOME, which this sets.
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c  # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: generated/pom.xml

      # Through run.sh rather than mvn directly, so the task runner that ships in
      # every generated project is verified alongside the project.
      #
      # `test` and not `verify`: this compiles every source and test — the
      # integration tests included, so a wrong name in one of those templates
      # still fails here — and runs the unit tests, without the production
      # frontend build and the browser download that `verify` adds. The
      # browserless tests it does run drive the real views.
      - name: build and test it
        working-directory: generated
        run: ./run.sh test

      - name: keep the build output on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: surefire-reports-${{ matrix.name }}
          path: generated/target/surefire-reports/
          if-no-files-found: ignore
